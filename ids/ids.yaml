# Mini SOC IDS configuration (task 4.2).
#
# Live configuration: ids/ids.yaml in the repo (IDS_CONFIG overrides the path).
# The daemon reads every threshold, window, allow-list entry, output path and
# signature from here - nothing is hard-coded in ids/live_ids_ips.py.
#
# A small set of IDS_*/SOC_HOSTNAME environment variables (systemd
# EnvironmentFile = the repo .env) can override individual values without
# editing this file; the YAML remains the primary source.

# --- Detection thresholds / windows ----------------------------------------
thresholds:
  # Port scan: distinct destination ports from one source inside the window.
  scan_window_sec: 60
  scan_threshold: 20

  # SSH brute force: failed logins from one source inside the window.
  ssh_window_sec: 300
  ssh_threshold: 10

  # SYN flood (optional extra signature, task 4.6): SYN packets per source.
  syn_window_sec: 60
  syn_threshold: 100

  # DNS anomaly (task 4.5): queries/min above the rate, or a single query
  # label longer than dns_max_label_len, raises a dns_query event.
  dns_window_sec: 60
  dns_rate_per_min: 100
  dns_max_label_len: 50

  # Outbound connections (task 4.4): destination ports NOT listed here raise
  # an outbound_connection event.
  outbound_allow: [53, 80, 443, 123, 67, 68, 546, 547, 5353, 5355, 1900, 3702]

# --- Allow-list (task 4.2) --------------------------------------------------
# IPs that never raise an alert.  analyst_ips are the analysts' own addresses;
# approved_scanner_ips are IPs allowed to scan (e.g. the vulnerability scanner).
allow_list:
  analyst_ips: []
  approved_scanner_ips: []

# --- Output -----------------------------------------------------------------
output:
  path: /var/log/mini_soc_ids.json

# --- General ----------------------------------------------------------------
general:
  # Hostname written on every event.
  hostname: ec2-host

  # nftables log prefixes the daemon looks for (task 4.1).  Configure these to
  # match the firewall actually deployed.
  soc_drop_prefix: "SOC_DROP:"
  soc_out_prefix: "SOC_OUT:"

  # Alternative marker for an nftables rule that logs nmap-style probes.
  nmap_probe_markers:
    - "NMAP_SCAN_PROBE"

  # Minimum seconds between repeated alerts of the same kind from one IP.
  cooldown_sec: 300

  # journalctl arguments.  -o short-iso keeps the original timestamp on the
  # raw line (task 4.3).
  journal_args: ["-f", "-n", "0", "-o", "short-iso"]

  # Memory bounding (task 4.8): drop idle IPs every prune_interval_sec when
  # they have had no activity for idle_ttl_sec.
  prune_interval_sec: 300
  idle_ttl_sec: 900

# --- DNS sniffing (task 4.5) ------------------------------------------------
# enabled: watch UDP/53 queries with a raw AF_PACKET socket (needs CAP_NET_RAW,
# granted by the packaged unit).  Set interface to a name (e.g. ens5) or leave
# null to listen on every interface.
dns:
  enabled: true
  interface: null

# --- Signatures -------------------------------------------------------------
# id/msg/priority/category for every event the daemon raises (task 4.11).
# priority is Suricata-style: 1 = high, 2 = medium, 3 = low.
signatures:
  scan:
    id: 9000001
    msg: "MINI-SOC Port Scan Detected"
    priority: 2
    category: "Attempted Information Leak"
  ssh:
    id: 9000002
    msg: "MINI-SOC SSH Brute Force Detected"
    priority: 1
    category: "Attempted User Privilege Gain"
  syn_flood:
    id: 9000003
    msg: "MINI-SOC SYN Flood Detected"
    priority: 2
    category: "Attempted Denial of Service"
  dns:
    id: 9000004
    msg: "MINI-SOC DNS Tunneling Suspected"
    priority: 2
    category: "Potential DNS Tunneling"
  outbound:
    id: 9000005
    msg: "Mini-SOC Unusual Outbound Connection"
    priority: 3
    category: "Potential Data Exfiltration"
