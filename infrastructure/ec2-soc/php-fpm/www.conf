; Original path: /etc/php/8.3/fpm/pool.d/www.conf
;
; PHP-FPM pool used by DVWA. Only cosmetic/limit settings are changed from
; the Ubuntu default; the socket is what nginx/dvwa.conf fastcgi_passes to.
;
; Ubuntu 24.04 ships PHP 8.3, so the binary paths are 8.3.

[www]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

chdir = /var/www/dvwa

; Default (commented upstream) — leaving the log off keeps this file simple.
; access.log = /var/log/$pool.access.log
catch_workers_output = yes
