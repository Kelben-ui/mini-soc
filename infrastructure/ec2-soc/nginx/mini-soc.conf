# Original path: /etc/nginx/sites-available/mini-soc.conf
#
# Rendered by deploy/install.sh from the templates
# (@DOMAIN@, @APP_DIR@, @TLS_CERT@, @TLS_KEY@); the values below are the
# placeholders, not the host's real domain or paths.
#
# Serves the built SOC dashboard (SPA) and reverse-proxies the API. It is
# bound to 443 and is analyst-only: the Security Group restricts 443 to the
# analyst's IP, unlike DVWA's world-open 80.
#
# The `soc` log format is defined in nginx.conf (contract §2.5).

# Plain HTTP to the dashboard domain is redirected to TLS. The bare IP on
# port 80 is handled by dvwa.conf (default_server), so this only matches
# requests for the dashboard's own Host.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @DOMAIN@;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root @APP_DIR@/frontend/dist;
    index index.html;

    access_log /var/log/nginx/access.log soc;

    # /api → FastAPI on localhost. proxy_pass has NO trailing slash so the
    # /api prefix is preserved for the routers.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
