# Original path: /etc/nginx/nginx.conf
#
# Main nginx config for the Mini SOC instance. The frozen `soc` log format
# (contract §2.5) is defined here in the http block and used by every server,
# because the collector parses /var/log/nginx/access.log for the web rules
# (SQLi, XSS, cmd injection, traversal, scans, floods).
#
# The two sites live in /etc/nginx/sites-available/ and are symlinked into
# /etc/nginx/sites-enabled/:
#   mini-soc.conf  dashboard (443, analyst-only via the Security Group)
#   dvwa.conf      DVWA web target (80, world-open)

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Don't advertise the exact nginx build.
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Frozen contract log format. escape=none keeps the request body raw for
    # the detection rules; the collector normalizes $time_iso8601 to UTC and
    # URL-decodes the payload itself.
    log_format soc escape=none '$remote_addr - $remote_user [iso=$time_iso8601] '
        '"$request_method $request_uri $server_protocol" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" body=$request_body';

    access_log /var/log/nginx/access.log soc;
    error_log /var/log/nginx/error.log;

    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
