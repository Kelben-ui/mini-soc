# Original path: /etc/nginx/sites-available/dvwa.conf
# (symlinked to /etc/nginx/sites-enabled/dvwa.conf)
#
# DVWA = the intentionally-vulnerable web target the whole detection suite is
# aimed at. It listens on 80 because the Security Group opens 22 and 80 to
# the internet, matching the spec's "only 22/80 allowed" rule.
#
# php8.3-fpm is the only PHP handler (PHP 8.3 ships with Ubuntu 24.04). The
# access log uses the `soc` format defined in nginx.conf so the collector's
# nginx_access_parser.py sees raw request bodies and User-Agents.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/dvwa;
    index index.php index.html index.htm;

    access_log /var/log/nginx/access.log soc;
    error_log  /var/log/nginx/error.log;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Never serve DVWA's own dotfiles.
    location ~ /\.ht {
        deny all;
    }
}
