#!/usr/sbin/nft -f
#
# Original path: /etc/nftables.conf
# Mini SOC host firewall (infrastructure/ec2-soc snapshot, task 8.1).
#
# Input
#   - established/related, loopback and ICMP are accepted.
#   - @blocklist (the administrative set soc-block writes) is dropped first.
#   - management/attack/dashboard ports 22, 80 and 443 are accepted *and*
#     logged as SOC_ACCEPT: so the analyst can see accepted sessions.
#   - everything else is logged as SOC_DROP: and dropped.
# Output
#   - new, non-loopback outbound connections are logged as SOC_OUT:.
#
# The collector/IDS parse the journal for SOC_DROP:/SOC_ACCEPT:/SOC_OUT:
# lines. Only traffic that reaches this host is logged here — the EC2
# Security Group (security-group.json) drops the rest before it arrives, so
# the two are kept in sync.
#
# Keep this file valid: a syntax error makes nftables.service fail and leaves
# the previous ruleset in place.

flush ruleset

table inet filter {
    # IPs blocked by the response-action helper (/usr/local/sbin/soc-block,
    # task 4.7). Entries carry a timeout so a block expires on its own.
    set blocklist {
        type ipv4_addr
        flags timeout
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        iif "lo" accept

        # ICMP first so the host still answers ping / path-MTU discovery.
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # A blocked source is dropped before anything else can answer it.
        ip saddr @blocklist drop

        # SSH (attack target) and DVWA HTTP (attack target) are world-open;
        # the dashboard/API on 443 is restricted by the Security Group to
        # analyst IPs only. Accept *and* log so accepted sessions are visible.
        tcp dport { 22, 80, 443 } log prefix "SOC_ACCEPT: " limit rate 20/second accept

        # Everything else is dropped and logged for the IDS. The rate limit
        # protects the journal from a flood while staying well above the
        # 15-distinct-ports scan threshold.
        log prefix "SOC_DROP: " limit rate 20/second
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;

        oif "lo" accept

        # New (non-loopback) outbound connections are logged so unusual
        # destinations can raise unusual_outbound (task 4.4).
        ct state new log prefix "SOC_OUT: " limit rate 60/minute
    }
}
