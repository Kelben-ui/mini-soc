#!/usr/sbin/nft -f
#
# Mini SOC host firewall (task 4.1/4.4/4.7).
#
# deploy/install.sh copies this file to /etc/nftables.conf and enables the
# nftables.service.  It replaces the inline iptables rules the old
# infrastructure/fw-01 box used and is the source of the log lines the IDS
# reads:
#
#   SOC_DROP:  every packet the input policy drops (port scans, probes ...)
#   SOC_OUT:   every new outbound connection the host initiates
#
# Only traffic that actually reaches this host is logged here.  The EC2
# Security Group drops everything else before it arrives (documented in
# docs/architecture.md), which is why the SG and this table are kept in sync.
#
# Keep this file valid at all times: a syntax error makes `nftables.service`
# fail and leaves the previous ruleset in place.

flush ruleset

table inet filter {
    # IPs blocked by the response-action helper (/usr/local/sbin/soc-block,
    # task 4.7).  Entries carry a timeout so a block expires on its own.
    set blocklist {
        type ipv4_addr
        flags timeout
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        iif "lo" accept

        # ICMP first so the host still answers ping / path-MTU discovery.
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # A blocked source is dropped before anything else can answer it.
        ip saddr @blocklist drop

        # Management + dashboard.  The Security Group restricts the sources
        # further; inside the host these ports stay open.
        tcp dport 22 accept
        tcp dport 80 accept
        tcp dport 443 accept

        # Everything else is dropped and logged for the IDS.  The rate limit
        # protects the journal from a flood while staying well above the
        # 15-distinct-ports scan threshold.
        log prefix "SOC_DROP: " limit rate 20/second
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;

        oif "lo" accept

        # New (non-loopback) outbound connections are logged so unusual
        # destinations can raise unusual_outbound (task 4.4).
        ct state new log prefix "SOC_OUT: " limit rate 60/minute
    }
}
