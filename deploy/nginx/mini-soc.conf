# Mini SOC nginx site template.
#
# Rendered by deploy/install.sh (placeholders @APP_DIR@, @DOMAIN@, @TLS_CERT@,
# @TLS_KEY@) into /etc/nginx/sites-available/mini-soc.conf.
#
# `soc` access log format (frozen contract §2.5): the request body is appended
# at the end of the line after `body=` (with escape=none so payloads stay
# byte-for-byte raw), and $time_iso8601 carries the UTC offset, which the
# collector parser (collector/parsers/nginx_access_parser.py) normalizes to
# UTC.  $request_body is populated for proxied requests (default
# proxy_request_buffering on).
#
# Note: escape=none keeps the payload raw; a URL-encoded attacker payload is
# only decoded inside the collector parser (unquote_plus, twice).
log_format soc escape=none '$remote_addr - $remote_user [iso=$time_iso8601] '
    '"$request_method $request_uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" body=$request_body';

# Redirect plain HTTP to TLS.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    # Log redirects in the same `soc` format as :443.  Without this the
    # default `combined` format is inherited and its lines land in the same
    # access.log, where the collector's nginx_access parser cannot read them
    # (they become 422 batches).  Keep the whole file parseable.
    access_log /var/log/nginx/access.log soc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @DOMAIN@;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log soc;
    client_max_body_size 25m;

    root @APP_DIR@/frontend/dist;
    index index.html;

    # API proxy.  The backend routers are mounted under /api/..., so the
    # prefix must be preserved: proxy_pass has NO trailing slash/URI here.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback + security headers (task 9.2).  nginx does not merge
    # add_header across levels, so the full set lives on this location; the
    # /api responses get their headers from the FastAPI middleware instead.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        try_files $uri $uri/ /index.html;
    }
}
