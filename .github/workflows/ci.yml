name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Import smoke test
        env:
          DATABASE_URL: sqlite:///./ci-smoke.db
        run: |
          python -c "import mini_soc_config, collector.main, detection.run, backend.app.main; print('imports ok')"
      - name: Shell script syntax
        run: |
          bash -n deploy/install.sh
          bash -n deploy/update.sh
          bash -n deploy/postgres.sh
      - name: Run collector parser tests
        run: pytest -v collector
      - name: Run log agent tests
        run: pytest -v agents
      - name: Detection replay (13 rules vs SQLite)
        env:
          DATABASE_URL: sqlite:///./ci-replay.db
          PYTHONPATH: .
        run: |
          python detection/tests/replay_test.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
