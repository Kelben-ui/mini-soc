name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# One run per ref: a new push cancels the previous, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Import smoke test
        env:
          DATABASE_URL: sqlite:///./ci-smoke.db
        run: |
          python -c "import mini_soc_config, collector.main, detection.run, backend.app.main, ids.live_ids_ips; print('imports ok')"
      - name: Shell script syntax
        run: |
          for f in deploy/*.sh deploy/soc-block attack-sim/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: Python tests — all components
        env:
          DATABASE_URL: sqlite:///./ci-pytest.db
          PYTHONPATH: .
          INGEST_API_KEY: test-key
          JWT_SECRET_KEY: test-secret
        run: pytest -q ids backend collector agents
      - name: Detection replay (13 rules vs SQLite)
        env:
          DATABASE_URL: sqlite:///./ci-replay.db
          PYTHONPATH: .
        run: |
          python detection/tests/replay_test.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
