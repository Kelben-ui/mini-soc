id: WEB-CMD-001
name: Command injection
severity: HIGH
category: web
enabled: true

match:
  category: web
  action: http_request

# A single shell metacharacter (optionally repeated, e.g. ``&&``) followed by a
# common command.  ``[;&|]+`` covers ``;whoami``, ``| id``, ``&&cat ...`` and
# ``||sh`` alike; the previous literal-only list missed ``&&cat`` and any form
# attack-sim/commands send without a space.
regex:
  - "[;&|]+\\s*(whoami|id|cat|uname|ls|nc|curl|wget|bash|sh|python|ping|sleep)\\b"

mitre: T1059
